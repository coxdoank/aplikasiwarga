<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>WargaKita - PWA Sistem RT/RW Modern</title>
  
  <!-- PWA Meta Tags -->
  <meta name="theme-color" content="#2563eb" />
  <meta name="description" content="Aplikasi Manajemen Warga RT/RW Berbasis PWA" />
  <link rel="apple-touch-icon" href="https://cdn-icons-png.flaticon.com/512/6009/6009869.png" />

  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            brand: '#2563eb',
          }
        }
      }
    }
  </script>

  <!-- React & ReactDOM -->
  <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  
  <!-- Babel Compiler for JSX -->
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

  <!-- Lucide Icons -->
  <script src="https://unpkg.com/lucide@latest"></script>

  <!-- Recharts & Dependencies -->
  <script src="https://unpkg.com/prop-types@15.8.1/prop-types.min.js"></script>

  <!-- Firebase App & Firestore Web SDK (v9/v10 Compat) -->
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-auth-compat.js"></script>
</head>
<body class="bg-slate-50 text-slate-800 dark:bg-slate-900 dark:text-slate-100 min-h-screen">

  <!-- Root Element -->
  <div id="root"></div>

  <!-- React Code inside Script with type="text/babel" -->
  <script type="text/babel">
    const { useState, useEffect } = React;

    // --- Mock Data ---
    const initialWarga = [
      { id: '1', nama: 'Budi Santoso', noKK: '3171012345670001', blok: 'A1', nomorRumah: '12', statusRumah: 'Ditempati', jumlahAnggota: 4, gender: 'L' },
      { id: '2', nama: 'Siti Rahma', noKK: '3171012345670002', blok: 'A1', nomorRumah: '14', statusRumah: 'Disewakan', jumlahAnggota: 3, gender: 'P' },
      { id: '3', nama: 'Ahmad Yani', noKK: '3171012345670003', blok: 'B2', nomorRumah: '05', statusRumah: 'Kosong', jumlahAnggota: 0, gender: 'L' },
    ];

    const initialKas = [
      { id: '1', tanggal: '2026-03-01', keterangan: 'IPL Maret - Budi Santoso', tipe: 'Pemasukan', jumlah: 150000 },
      { id: '2', tanggal: '2026-03-02', keterangan: 'Perbaikan Lampu Jalan Gang A', tipe: 'Pengeluaran', jumlah: 350000 },
      { id: '3', tanggal: '2026-03-05', keterangan: 'IPL Maret - Siti Rahma', tipe: 'Pemasukan', jumlah: 150000 },
    ];

    function App() {
      const [activeTab, setActiveTab] = useState('warga');
      const [wargaList, setWargaList] = useState(initialWarga);
      const [kasList, setKasList] = useState(initialKas);
      const [filterStatus, setFilterStatus] = useState('Semua');
      
      // Form States
      const [newWarga, setNewWarga] = useState({ nama: '', noKK: '', blok: 'A1', nomorRumah: '', statusRumah: 'Ditempati', jumlahAnggota: 1, gender: 'L' });
      const [newKas, setNewKas] = useState({ keterangan: '', tipe: 'Pemasukan', jumlah: '' });

      // Re-render Lucide Icons after component updates
      useEffect(() => {
        if (window.lucide) {
          window.lucide.createIcons();
        }
      });

      // Handlers
      const handleAddWarga = (e) => {
        e.preventDefault();
        setWargaList([...wargaList, { ...newWarga, id: Date.now().toString() }]);
        setNewWarga({ nama: '', noKK: '', blok: 'A1', nomorRumah: '', statusRumah: 'Ditempati', jumlahAnggota: 1, gender: 'L' });
      };

      const handleAddKas = (e) => {
        e.preventDefault();
        setKasList([...kasList, { 
          ...newKas, 
          id: Date.now().toString(), 
          tanggal: new Date().toISOString().split('T')[0],
          jumlah: Number(newKas.jumlah)
        }]);
        setNewKas({ keterangan: '', tipe: 'Pemasukan', jumlah: '' });
      };

      const totalPemasukan = kasList.filter(k => k.tipe === 'Pemasukan').reduce((acc, k) => acc + k.jumlah, 0);
      const totalPengeluaran = kasList.filter(k => k.tipe === 'Pengeluaran').reduce((acc, k) => acc + k.jumlah, 0);
      const saldoKas = totalPemasukan - totalPengeluaran;

      const filteredWarga = filterStatus === 'Semua' 
        ? wargaList 
        : wargaList.filter(w => w.statusRumah === filterStatus);

      return (
        <div className="max-w-md mx-auto min-h-screen pb-20 shadow-lg bg-white dark:bg-slate-800">
          {/* Header PWA */}
          <header className="bg-blue-600 text-white p-4 sticky top-0 z-10 shadow-md flex justify-between items-center">
            <div>
              <h1 className="font-bold text-lg flex items-center gap-2">
                <i data-lucide="home" className="w-5 h-5"></i> WargaKita
              </h1>
              <p className="text-xs text-blue-100">Sistem Informasi RT 05 / RW 02</p>
            </div>
            <span className="text-xs bg-blue-700 px-2.5 py-1 rounded-full font-medium">PWA Ready</span>
          </header>

          {/* Main Content */}
          <main className="p-4">
            {/* TAB 1: MANAJEMEN WARGA */}
            {activeTab === 'warga' && (
              <div className="space-y-4">
                <div className="flex justify-between items-center">
                  <h2 className="font-semibold text-slate-700 dark:text-slate-200">Database Warga</h2>
                  <select 
                    value={filterStatus}
                    onChange={(e) => setFilterStatus(e.target.value)}
                    className="text-xs border p-1.5 rounded-lg dark:bg-slate-700 dark:border-slate-600"
                  >
                    <option value="Semua">Semua Status</option>
                    <option value="Ditempati">Ditempati</option>
                    <option value="Disewakan">Disewakan</option>
                    <option value="Kosong">Kosong</option>
                  </select>
                </div>

                {/* Form Tambah Warga */}
                <form onSubmit={handleAddWarga} className="bg-slate-50 dark:bg-slate-700/50 p-3 rounded-xl border dark:border-slate-600 text-xs space-y-2">
                  <span className="font-bold block text-slate-600 dark:text-slate-300">Tambah Warga Baru</span>
                  <div className="grid grid-cols-2 gap-2">
                    <input required placeholder="Nama Lengkap" value={newWarga.nama} onChange={e => setNewWarga({...newWarga, nama: e.target.value})} className="p-2 border rounded dark:bg-slate-800 dark:border-slate-600" />
                    <input required placeholder="No. KK" value={newWarga.noKK} onChange={e => setNewWarga({...newWarga, noKK: e.target.value})} className="p-2 border rounded dark:bg-slate-800 dark:border-slate-600" />
                    <input required placeholder="Blok & No" value={newWarga.nomorRumah} onChange={e => setNewWarga({...newWarga, nomorRumah: e.target.value})} className="p-2 border rounded dark:bg-slate-800 dark:border-slate-600" />
                    <select value={newWarga.statusRumah} onChange={e => setNewWarga({...newWarga, statusRumah: e.target.value})} className="p-2 border rounded dark:bg-slate-800 dark:border-slate-600">
                      <option value="Ditempati">Ditempati</option>
                      <option value="Disewakan">Disewakan</option>
                      <option value="Kosong">Kosong</option>
                    </select>
                  </div>
                  <button type="submit" className="w-full bg-blue-600 text-white p-2 rounded-lg font-medium flex items-center justify-center gap-1">
                    <i data-lucide="plus-circle" className="w-4 h-4"></i> Simpan Data
                  </button>
                </form>

                {/* List Warga */}
                <div className="space-y-2">
                  {filteredWarga.map((w) => (
                    <div key={w.id} className="p-3 border rounded-xl dark:border-slate-700 flex justify-between items-center bg-white dark:bg-slate-800 shadow-sm">
                      <div>
                        <p className="font-bold text-sm">{w.nama}</p>
                        <p className="text-xs text-slate-500 dark:text-slate-400">Blok {w.blok}/{w.nomorRumah} • KK: {w.noKK}</p>
                      </div>
                      <span className={`text-[10px] px-2 py-0.5 rounded-full font-semibold ${
                        w.statusRumah === 'Ditempati' ? 'bg-emerald-100 text-emerald-700' :
                        w.statusRumah === 'Disewakan' ? 'bg-amber-100 text-amber-700' : 'bg-slate-100 text-slate-600'
                      }`}>
                        {w.statusRumah}
                      </span>
                    </div>
                  ))}
                </div>
              </div>
            )}

            {/* TAB 2: IURAN & KAS */}
            {activeTab === 'kas' && (
              <div className="space-y-4">
                {/* Ringkasan Kas */}
                <div className="bg-gradient-to-r from-blue-600 to-indigo-600 text-white p-4 rounded-xl shadow-sm">
                  <p className="text-xs opacity-80">Total Saldo Kas RT</p>
                  <p className="text-2xl font-bold">Rp {saldoKas.toLocaleString('id-ID')}</p>
                  <div className="flex justify-between mt-3 text-xs pt-2 border-t border-white/20">
                    <span>Masuk: Rp {totalPemasukan.toLocaleString('id-ID')}</span>
                    <span>Keluar: Rp {totalPengeluaran.toLocaleString('id-ID')}</span>
                  </div>
                </div>

                {/* Form Transaksi */}
                <form onSubmit={handleAddKas} className="bg-slate-50 dark:bg-slate-700/50 p-3 rounded-xl border dark:border-slate-600 text-xs space-y-2">
                  <span className="font-bold block text-slate-600 dark:text-slate-300">Catat Kas / IPL</span>
                  <input required placeholder="Keterangan (contoh: IPL Budi)" value={newKas.keterangan} onChange={e => setNewKas({...newKas, keterangan: e.target.value})} className="w-full p-2 border rounded dark:bg-slate-800 dark:border-slate-600" />
                  <div className="grid grid-cols-2 gap-2">
                    <input required type="number" placeholder="Nominal (Rp)" value={newKas.jumlah} onChange={e => setNewKas({...newKas, jumlah: e.target.value})} className="p-2 border rounded dark:bg-slate-800 dark:border-slate-600" />
                    <select value={newKas.tipe} onChange={e => setNewKas({...newKas, tipe: e.target.value})} className="p-2 border rounded dark:bg-slate-800 dark:border-slate-600">
                      <option value="Pemasukan">Pemasukan</option>
                      <option value="Pengeluaran">Pengeluaran</option>
                    </select>
                  </div>
                  <button type="submit" className="w-full bg-emerald-600 text-white p-2 rounded-lg font-medium flex items-center justify-center gap-1">
                    <i data-lucide="wallet" className="w-4 h-4"></i> Catat Transaksi
                  </button>
                </form>

                {/* Riwayat Kas */}
                <div className="space-y-2">
                  <p className="text-xs font-semibold text-slate-500">Riwayat Transaksi Terakhir</p>
                  {kasList.map((k) => (
                    <div key={k.id} className="p-3 border rounded-xl dark:border-slate-700 flex justify-between items-center text-xs">
                      <div>
                        <p className="font-semibold">{k.keterangan}</p>
                        <p className="text-[10px] text-slate-400">{k.tanggal}</p>
                      </div>
                      <span className={`font-bold ${k.tipe === 'Pemasukan' ? 'text-emerald-600' : 'text-rose-600'}`}>
                        {k.tipe === 'Pemasukan' ? '+' : '-'} Rp {k.jumlah.toLocaleString('id-ID')}
                      </span>
                    </div>
                  ))}
                </div>
              </div>
            )}

            {/* TAB 3: LAPORAN & EXPORT */}
            {activeTab === 'laporan' && (
              <div className="space-y-4">
                <h2 className="font-semibold text-slate-700 dark:text-slate-200">Laporan & Transparansi</h2>
                
                <div className="p-4 border rounded-xl dark:border-slate-700 space-y-3 bg-white dark:bg-slate-800">
                  <div className="flex items-center gap-3">
                    <div className="p-2 bg-blue-100 text-blue-600 rounded-lg">
                      <i data-lucide="bar-chart-3" className="w-6 h-6"></i>
                    </div>
                    <div>
                      <p className="font-bold text-sm">Statistik Hunian</p>
                      <p className="text-xs text-slate-500">Total {wargaList.length} Unit Rumah Terdata</p>
                    </div>
                  </div>
                  <div className="grid grid-cols-3 gap-2 text-center text-xs pt-2">
                    <div className="p-2 bg-slate-50 rounded-lg dark:bg-slate-700">
                      <p className="font-bold text-emerald-600">{wargaList.filter(w => w.statusRumah === 'Ditempati').length}</p>
                      <p className="text-[10px] text-slate-400">Ditempati</p>
                    </div>
                    <div className="p-2 bg-slate-50 rounded-lg dark:bg-slate-700">
                      <p className="font-bold text-amber-600">{wargaList.filter(w => w.statusRumah === 'Disewakan').length}</p>
                      <p className="text-[10px] text-slate-400">Disewakan</p>
                    </div>
                    <div className="p-2 bg-slate-50 rounded-lg dark:bg-slate-700">
                      <p className="font-bold text-slate-500">{wargaList.filter(w => w.statusRumah === 'Kosong').length}</p>
                      <p className="text-[10px] text-slate-400">Kosong</p>
                    </div>
                  </div>
                </div>

                <div className="p-4 border rounded-xl dark:border-slate-700 space-y-3 bg-white dark:bg-slate-800">
                  <p className="font-bold text-sm">Export Data Rekap</p>
                  <p className="text-xs text-slate-500">Unduh data warga dan keuangan dalam format CSV/Excel.</p>
                  <button 
                    onClick={() => alert("Fitur unduh CSV siap diintegrasikan!")} 
                    className="w-full border border-blue-600 text-blue-600 dark:text-blue-400 p-2 rounded-lg text-xs font-semibold flex items-center justify-center gap-2"
                  >
                    <i data-lucide="download" className="w-4 h-4"></i> Download Laporan CSV
                  </button>
                </div>
              </div>
            )}
          </main>

          {/* Mobile Bottom Navigation Bar */}
          <nav className="fixed bottom-0 left-1/2 -translate-x-1/2 w-full max-w-md bg-white dark:bg-slate-800 border-t dark:border-slate-700 flex justify-around p-2 z-20">
            <button 
              onClick={() => setActiveTab('warga')} 
              className={`flex flex-col items-center gap-1 text-xs font-medium p-1 ${activeTab === 'warga' ? 'text-blue-600' : 'text-slate-400'}`}
            >
              <i data-lucide="users" className="w-5 h-5"></i> Warga
            </button>
            <button 
              onClick={() => setActiveTab('kas')} 
              className={`flex flex-col items-center gap-1 text-xs font-medium p-1 ${activeTab === 'kas' ? 'text-blue-600' : 'text-slate-400'}`}
            >
              <i data-lucide="credit-card" className="w-5 h-5"></i> Iuran & Kas
            </button>
            <button 
              onClick={() => setActiveTab('laporan')} 
              className={`flex flex-col items-center gap-1 text-xs font-medium p-1 ${activeTab === 'laporan' ? 'text-blue-600' : 'text-slate-400'}`}
            >
              <i data-lucide="pie-chart" className="w-5 h-5"></i> Laporan
            </button>
          </nav>
        </div>
      );
    }

    // Render React App
    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
