<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PWA Absensi Face Recognition - Prototipe</title>
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- MediaPipe Face Mesh & Camera Utils -->
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js" crossorigin="anonymous"></script>
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/face_mesh/face_mesh.js" crossorigin="anonymous"></script>
</head>
<body class="bg-slate-100 min-h-screen flex flex-col items-center p-4 font-sans">

  <!-- Header -->
  <header class="w-full max-w-md text-center my-4">
    <h1 class="text-2xl font-bold text-slate-800">Absensi Sekolah PWA</h1>
    <p class="text-sm text-slate-500">Prototipe Presensi Wajah Real-time</p>
  </header>

  <!-- Container Utama -->
  <main class="w-full max-w-md bg-white rounded-2xl shadow-xl overflow-hidden border border-slate-200">
    
    <!-- Viewport Kamera -->
    <div class="relative bg-black aspect-[4/3] flex items-center justify-center overflow-hidden">
      <video id="webcam" class="absolute inset-0 w-full h-full object-cover -scale-x-100" autoplay playsinline></video>
      <canvas id="output_canvas" class="absolute inset-0 w-full h-full object-cover -scale-x-100"></canvas>
      
      <!-- Overlay Panduan Wajah -->
      <div class="absolute inset-0 flex items-center justify-center pointer-events-none">
        <div class="w-48 h-64 border-2 border-dashed border-cyan-400/70 rounded-[50%] animate-pulse"></div>
      </div>

      <!-- Status Indicator -->
      <div id="status-badge" class="absolute top-3 left-3 bg-black/60 backdrop-blur-md text-white text-xs px-3 py-1.5 rounded-full flex items-center gap-2">
        <span class="w-2 h-2 rounded-full bg-yellow-400 animate-ping"></span>
        <span id="status-text">Memuat Model AI...</span>
      </div>
    </div>

    <!-- Panel Kontrol & Aksi -->
    <div class="p-5 space-y-4">
      
      <!-- Form Pendaftaran Siswa Baru -->
      <div class="bg-slate-50 p-3 rounded-xl border border-slate-200 space-y-2">
        <label class="block text-xs font-semibold text-slate-600 uppercase tracking-wider">Registrasi Siswa Baru</label>
        <div class="flex gap-2">
          <input type="text" id="input-nama" placeholder="Masukkan nama siswa..." class="flex-1 px-3 py-2 text-sm border border-slate-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500">
          <button id="btn-daftar" disabled class="bg-blue-600 hover:bg-blue-700 disabled:bg-slate-300 text-white text-sm px-4 py-2 rounded-lg font-medium transition">
            Daftar
          </button>
        </div>
      </div>

      <!-- Log Absensi Berhasil -->
      <div>
        <h3 class="text-xs font-semibold text-slate-600 uppercase tracking-wider mb-2">Riwayat Presensi Hari Ini</h3>
        <ul id="log-list" class="space-y-2 max-h-40 overflow-y-auto text-sm">
          <li class="text-slate-400 text-xs italic text-center py-2">Belum ada data presensi.</li>
        </ul>
      </div>

    </div>
  </main>

  <!-- Script Logika Prototipe -->
  <script>
    const videoElement = document.getElementById('webcam');
    const canvasElement = document.getElementById('output_canvas');
    const canvasCtx = canvasElement.getContext('2d');
    const statusText = document.getElementById('status-text');
    const statusBadge = document.getElementById('status-badge');
    const btnDaftar = document.getElementById('btn-daftar');
    const inputNama = document.getElementById('input-nama');
    const logList = document.getElementById('log-list');

    // Database Sederhana di Memori Browser (Lokal)
    let registeredFaces = []; // Array berisi { nama: string, landmarks: Array }
    let currentLandmarks = null;
    let isProcessingMatch = false;

    // 1. Inisialisasi MediaPipe Face Mesh
    const faceMesh = new FaceMesh({
      locateFile: (file) => `https://cdn.jsdelivr.net/npm/@mediapipe/face_mesh/${file}`
    });

    faceMesh.setOptions({
      maxNumFaces: 1,
      refineLandmarks: true,
      minDetectionConfidence: 0.6,
      minTrackingConfidence: 0.6
    });

    faceMesh.onResults(onResults);

    // 2. Setup Kamera
    const camera = new Camera(videoElement, {
      onFrame: async () => {
        await faceMesh.send({ image: videoElement });
      },
      width: 640,
      height: 480
    });

    camera.start().then(() => {
      statusText.innerText = "Arahkan wajah ke kamera";
    });

    // 3. Callback saat Wajah Terdeteksi
    function onResults(results) {
      // Adjust canvas size
      canvasElement.width = videoElement.videoWidth;
      canvasElement.height = videoElement.videoHeight;
      canvasCtx.save();
      canvasCtx.clearRect(0, 0, canvasElement.width, canvasElement.height);

      if (results.multiFaceLandmarks && results.multiFaceLandmarks.length > 0) {
        currentLandmarks = results.multiFaceLandmarks[0];
        btnDaftar.disabled = false;

        // Visualisasi Titik Wajah Sederhana
        canvasCtx.fillStyle = '#22c55e';
        for (const point of currentLandmarks) {
          canvasCtx.beginPath();
          canvasCtx.arc(point.x * canvasElement.width, point.y * canvasElement.height, 1, 0, 2 * Math.PI);
          canvasCtx.fill();
        }

        // Proses Auto-Absen jika ada wajah terdaftar
        if (registeredFaces.length > 0 && !isProcessingMatch) {
          checkAttendance(currentLandmarks);
        }
      } else {
        currentLandmarks = null;
        btnDaftar.disabled = true;
      }
      canvasCtx.restore();
    }

    // 4. Mendaftarkan Wajah Siswa
    btnDaftar.addEventListener('click', () => {
      const nama = inputNama.value.trim();
      if (!nama) {
        alert("Silakan masukkan nama siswa terlebih dahulu!");
        return;
      }
      if (!currentLandmarks) {
        alert("Wajah tidak terdeteksi!");
        return;
      }

      // Simpan koordinat landmarks sebagai representasi unik wajah
      registeredFaces.push({
        nama: nama,
        landmarks: currentLandmarks,
        lastAbsen: 0
      });

      alert(`Berhasil mendaftarkan wajah untuk: ${nama}`);
      inputNama.value = '';
      statusText.innerText = `Terdaftar: ${registeredFaces.length} siswa`;
    });

    // 5. Fungsi Mengukur Jarak Matematis antar Landmark (Euclidean Distance sederhana)
    function calculateDistance(landmarksA, landmarksB) {
      let sum = 0;
      // Gunakan sampel beberapa titik kunci di wajah (mata, hidung, mulut)
      const keyPoints = [33, 263, 1, 61, 291, 199]; 
      for (let idx of keyPoints) {
        const dx = landmarksA[idx].x - landmarksB[idx].x;
        const dy = landmarksA[idx].y - landmarksB[idx].y;
        sum += Math.sqrt(dx * dx + dy * dy);
      }
      return sum / keyPoints.length;
    }

    // 6. Logika Match & Absensi Otomatis
    function checkAttendance(detectedLandmarks) {
      const now = Date.now();
      const THRESHOLD = 0.08; // Toleransi kemiripan wajah (semakin kecil semakin ketat)

      for (let student of registeredFaces) {
        // Jeda 10 detik agar tidak terjadi re-absen terus menerus
        if (now - student.lastAbsen < 10000) continue;

        const distance = calculateDistance(detectedLandmarks, student.landmarks);
        
        if (distance < THRESHOLD) {
          student.lastAbsen = now;
          triggerAbsenSuccess(student.nama);
          break;
        }
      }
    }

    // 7. Tampilan Absen Berhasil
    function triggerAbsenSuccess(nama) {
      isProcessingMatch = true;
      
      // Update UI Status
      statusText.innerText = `Absen Berhasil: ${nama}`;
      statusBadge.classList.remove('bg-black/60');
      statusBadge.classList.add('bg-green-600');

      // Tambahkan ke Log List
      const timeStr = new Date().toLocaleTimeString('id-ID', { hour: '2-digit', minute: '2-digit' });
      const li = document.createElement('li');
      li.className = 'flex justify-between items-center p-2 bg-green-50 border border-green-200 rounded-lg text-green-800 font-medium';
      li.innerHTML = `<span>Hadir: <b>${nama}</b></span><span class="text-xs text-green-600">${timeStr} WIB</span>`;
      
      // Hapus pesan kosong jika ada
      if (logList.children[0]?.classList.contains('italic')) {
        logList.innerHTML = '';
      }
      logList.prepend(li);

      // Reset status setelah 3 detik
      setTimeout(() => {
        statusText.innerText = "Arahkan wajah ke kamera";
        statusBadge.classList.remove('bg-green-600');
        statusBadge.classList.add('bg-black/60');
        isProcessingMatch = false;
      }, 3000);
    }
  </script>
</body>
</html>
