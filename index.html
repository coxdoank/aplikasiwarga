<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PWA Absensi Face Recognition - Perbaikan</title>
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- MediaPipe Face Mesh & Camera Utils -->
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js" crossorigin="anonymous"></script>
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/face_mesh/face_mesh.js" crossorigin="anonymous"></script>
</head>
<body class="bg-slate-100 min-h-screen flex flex-col items-center p-4 font-sans">

  <!-- Header -->
  <header class="w-full max-w-md text-center my-4">
    <h1 class="text-2xl font-bold text-slate-800">Absensi Sekolah PWA</h1>
    <p class="text-sm text-slate-500">Prototipe Presensi Wajah Real-time</p>
  </header>

  <!-- Container Utama -->
  <main class="w-full max-w-md bg-white rounded-2xl shadow-xl overflow-hidden border border-slate-200">
    
    <!-- Viewport Kamera -->
    <div class="relative bg-black aspect-[4/3] flex items-center justify-center overflow-hidden">
      <video id="webcam" class="absolute inset-0 w-full h-full object-cover -scale-x-100" autoplay playsinline></video>
      <canvas id="output_canvas" class="absolute inset-0 w-full h-full object-cover -scale-x-100"></canvas>
      
      <!-- Overlay Panduan Wajah -->
      <div class="absolute inset-0 flex items-center justify-center pointer-events-none">
        <div id="guide-box" class="w-48 h-64 border-2 border-dashed border-yellow-400 rounded-[50%] transition-colors duration-300"></div>
      </div>

      <!-- Status Indicator -->
      <div id="status-badge" class="absolute top-3 left-3 bg-black/60 backdrop-blur-md text-white text-xs px-3 py-1.5 rounded-full flex items-center gap-2">
        <span id="status-dot" class="w-2 h-2 rounded-full bg-yellow-400 animate-ping"></span>
        <span id="status-text">Memuat Model AI...</span>
      </div>
    </div>

    <!-- Panel Kontrol & Aksi -->
    <div class="p-5 space-y-4">
      
      <!-- Form Pendaftaran Siswa Baru -->
      <div class="bg-slate-50 p-3 rounded-xl border border-slate-200 space-y-2">
        <label class="block text-xs font-semibold text-slate-600 uppercase tracking-wider">Registrasi Siswa Baru</label>
        <div class="flex gap-2">
          <input type="text" id="input-nama" placeholder="Masukkan nama siswa..." class="flex-1 px-3 py-2 text-sm border border-slate-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500">
          <button id="btn-daftar" class="bg-blue-600 hover:bg-blue-700 text-white text-sm px-4 py-2 rounded-lg font-medium transition cursor-pointer">
            Daftar
          </button>
        </div>
        <p id="helper-text" class="text-[11px] text-amber-600">Pastikan wajah berada di dalam lingkaran dan menghadap kamera.</p>
      </div>

      <!-- Log Absensi Berhasil -->
      <div>
        <h3 class="text-xs font-semibold text-slate-600 uppercase tracking-wider mb-2">Riwayat Presensi Hari Ini</h3>
        <ul id="log-list" class="space-y-2 max-h-40 overflow-y-auto text-sm">
          <li class="text-slate-400 text-xs italic text-center py-2">Belum ada data presensi.</li>
        </ul>
      </div>

    </div>
  </main>

  <!-- Script Logika Perbaikan -->
  <script>
    const videoElement = document.getElementById('webcam');
    const canvasElement = document.getElementById('output_canvas');
    const canvasCtx = canvasElement.getContext('2d');
    const statusText = document.getElementById('status-text');
    const statusDot = document.getElementById('status-dot');
    const statusBadge = document.getElementById('status-badge');
    const btnDaftar = document.getElementById('btn-daftar');
    const inputNama = document.getElementById('input-nama');
    const logList = document.getElementById('log-list');
    const guideBox = document.getElementById('guide-box');
    const helperText = document.getElementById('helper-text');

    let registeredFaces = []; 
    let currentLandmarks = null;
    let isProcessingMatch = false;

    // 1. Inisialisasi MediaPipe Face Mesh dengan konfigurasi stabil
    const faceMesh = new FaceMesh({
      locateFile: (file) => `https://cdn.jsdelivr.net/npm/@mediapipe/face_mesh/${file}`
    });

    faceMesh.setOptions({
      maxNumFaces: 1,
      refineLandmarks: true,
      minDetectionConfidence: 0.5,
      minTrackingConfidence: 0.5
    });

    faceMesh.onResults(onResults);

    // 2. Setup Kamera
    const camera = new Camera(videoElement, {
      onFrame: async () => {
        await faceMesh.send({ image: videoElement });
      },
      width: 640,
      height: 480
    });

    camera.start().then(() => {
      statusText.innerText = "Posisikan Wajah";
    }).catch(err => {
      statusText.innerText = "Kamera Gagal Diakses";
      alert("Pastikan memberikan izin akses kamera (Permission)");
    });

    // 3. Callback saat Wajah Terdeteksi
    function onResults(results) {
      canvasElement.width = videoElement.videoWidth;
      canvasElement.height = videoElement.videoHeight;
      canvasCtx.save();
      canvasCtx.clearRect(0, 0, canvasElement.width, canvasElement.height);

      if (results.multiFaceLandmarks && results.multiFaceLandmarks.length > 0) {
        currentLandmarks = results.multiFaceLandmarks[0];
        
        // Ubah indikator panduan jadi hijau tanda siap
        guideBox.classList.remove('border-yellow-400', 'animate-pulse');
        guideBox.classList.add('border-green-500');
        if (statusText.innerText.includes("Posisikan") || statusText.innerText.includes("Memuat")) {
          statusText.innerText = "Wajah Terdeteksi (Siap)";
          statusDot.classList.remove('bg-yellow-400');
          statusDot.classList.add('bg-green-400');
        }

        // Gambar titik wajah (landmarks)
        canvasCtx.fillStyle = '#22c55e';
        for (const point of currentLandmarks) {
          canvasCtx.beginPath();
          canvasCtx.arc(point.x * canvasElement.width, point.y * canvasElement.height, 1, 0, 2 * Math.PI);
          canvasCtx.fill();
        }

        // Jalankan pencocokan absen otomatis jika sudah ada data
        if (registeredFaces.length > 0 && !isProcessingMatch) {
          checkAttendance(currentLandmarks);
        }
      } else {
        currentLandmarks = null;
        guideBox.classList.remove('border-green-500');
        guideBox.classList.add('border-yellow-400', 'animate-pulse');
        statusText.innerText = "Wajah Tidak Terlihat";
        statusDot.classList.remove('bg-green-400');
        statusDot.classList.add('bg-yellow-400');
      }
      canvasCtx.restore();
    }

    // 4. Tombol Pendaftaran (Diperbaiki agar tidak disable permanen)
    btnDaftar.addEventListener('click', () => {
      const nama = inputNama.value.trim();
      if (!nama) {
        alert("Silakan masukkan nama siswa terlebih dahulu!");
        inputNama.focus();
        return;
      }
      if (!currentLandmarks) {
        alert("Wajah belum terdeteksi oleh kamera! Harap posisikan wajah di dalam kotak panduan.");
        return;
      }

      // Simpan data wajah
      registeredFaces.push({
        nama: nama,
        landmarks: JSON.parse(JSON.stringify(currentLandmarks)), // Clone data array
        lastAbsen: 0
      });

      helperText.innerText = `Berhasil! Total terdaftar: ${registeredFaces.length} siswa.`;
      helperText.className = "text-[11px] text-green-600 font-semibold";
      alert(`Berhasil mendaftarkan wajah untuk: ${nama}`);
      inputNama.value = '';
    });

    // 5. Perhitungan Jarak (Euclidean Distance)
    function calculateDistance(landmarksA, landmarksB) {
      let sum = 0;
      const keyPoints = [33, 263, 1, 61, 291, 199, 10, 152]; // Titik kunci lebih banyak agar akurat
      for (let idx of keyPoints) {
        const dx = landmarksA[idx].x - landmarksB[idx].x;
        const dy = landmarksA[idx].y - landmarksB[idx].y;
        sum += Math.sqrt(dx * dx + dy * dy);
      }
      return sum / keyPoints.length;
    }

    // 6. Logika Cek Absensi
    function checkAttendance(detectedLandmarks) {
      const now = Date.now();
      const THRESHOLD = 0.09; // Toleransi jarak (bisa disesuaikan jika terlalu ketat/longgar)

      for (let student of registeredFaces) {
        if (now - student.lastAbsen < 12000) continue; // Jeda 12 detik per orang

        const distance = calculateDistance(detectedLandmarks, student.landmarks);
        
        if (distance < THRESHOLD) {
          student.lastAbsen = now;
          triggerAbsenSuccess(student.nama);
          break;
        }
      }
    }

    // 7. Notifikasi Berhasil
    function triggerAbsenSuccess(nama) {
      isProcessingMatch = true;
      
      statusText.innerText = `Hadir: ${nama}`;
      statusBadge.classList.remove('bg-black/60');
      statusBadge.classList.add('bg-green-600');

      const timeStr = new Date().toLocaleTimeString('id-ID', { hour: '2-digit', minute: '2-digit' });
      const li = document.createElement('li');
      li.className = 'flex justify-between items-center p-2 bg-green-50 border border-green-200 rounded-lg text-green-800 font-medium animate-bounce';
      li.innerHTML = `<span><b>${nama}</b></span><span class="text-xs text-green-600">${timeStr} WIB</span>`;
      
      if (logList.children[0]?.classList.contains('italic')) {
        logList.innerHTML = '';
      }
      logList.prepend(li);

      setTimeout(() => {
        statusText.innerText = "Wajah Terdeteksi (Siap)";
        statusBadge.classList.remove('bg-green-600');
        statusBadge.classList.add('bg-black/60');
        isProcessingMatch = false;
      }, 3000);
    }
  </script>
</body>
</html>
